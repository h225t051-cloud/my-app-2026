<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabiPlan - 旅行計画アプリ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><i data-lucide="map-pin"></i> TabiPlan</h1>
            <nav>
                <button id="add-trip-btn" class="btn btn-primary"><i data-lucide="plus"></i> 新しい旅行</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="trip-header" class="card">
            <div class="trip-info">
                <h2 id="trip-title">北海道 4泊5日の旅</h2>
                <p id="trip-dates"><i data-lucide="calendar"></i> 2026/06/01 - 2026/06/05</p>
            </div>
            <div class="trip-stats">
                <div class="stat">
                    <span>予算</span>
                    <strong id="total-budget" class="editable-stat">¥150,000</strong>
                </div>
                <div class="stat">
                    <span>支出</span>
                    <strong id="total-spent">¥0</strong>
                </div>
            </div>
        </section>

        <section id="itinerary" class="grid-layout">
            <div class="days-nav">
                <ul id="days-list">
                    <li class="active">1日目</li>
                    <li>2日目</li>
                    <li>3日目</li>
                    <li>4日目</li>
                    <li>5日目</li>
                </ul>
            </div>
            <div class="activities-view">
                <div class="section-header">
                    <h3><i data-lucide="clock"></i> スケジュール</h3>
                    <button id="add-activity-btn" class="btn btn-secondary btn-sm"><i data-lucide="plus"></i> 追加</button>
                </div>
                <div id="activities-list" class="activities-list">
                    <!-- Activities will be injected here -->
                    <div class="activity-card">
                        <div class="time">09:00</div>
                        <div class="content">
                            <h4>新千歳空港 到着</h4>
                            <p>レンタカー受け取り</p>
                        </div>
                        <div class="actions">
                            <button class="btn-icon"><i data-lucide="edit-2"></i></button>
                            <button class="btn-icon text-danger"><i data-lucide="trash-2"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
