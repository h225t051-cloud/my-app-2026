<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabiPlan - 旅行計画アプリ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1 id="logo" style="cursor: pointer;"><i data-lucide="map-pin"></i> TabiPlan</h1>
            <nav>
                <button id="back-to-home" class="btn btn-secondary" style="display: none;"><i data-lucide="arrow-left"></i> 戻る</button>
                <button id="import-trip-btn" class="btn btn-secondary"><i data-lucide="download"></i> 読込</button>
                <button id="add-trip-btn" class="btn btn-primary"><i data-lucide="plus"></i> 新しい旅行</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Dashboard View -->
        <section id="dashboard-view">
            <h2 class="section-title">マイ・トリップ</h2>
            <div id="trips-grid" class="trips-grid">
                <!-- Trip cards will be injected here -->
            </div>
        </section>

        <!-- Trip Details View -->
        <section id="trip-view" style="display: none;">
            <div id="trip-header" class="card">
                <div class="trip-info">
                    <h2 id="trip-title">旅行タイトル</h2>
                    <p id="trip-dates"><i data-lucide="calendar"></i> 2026/01/01 - 2026/01/01</p>
                </div>
                <div class="trip-stats">
                    <div class="stat">
                        <span>合計予算</span>
                        <strong id="total-budget" class="editable-stat">¥0</strong>
                    </div>
                    <div class="stat">
                        <span>予定支出</span>
                        <strong id="total-spent" class="text-primary">¥0</strong>
                    </div>
                    <div class="stat">
                        <span>残り</span>
                        <strong id="budget-left">¥0</strong>
                    </div>
                    <button id="share-trip-btn" class="btn btn-secondary"><i data-lucide="share-2"></i> 共有</button>
                </div>
            </div>

            <div class="trip-content-grid">
                <div class="main-column">
                    <div class="grid-layout">
                        <div class="days-nav">
                            <ul id="days-list"></ul>
                        </div>
                        <div class="activities-view">
                            <div class="section-header">
                                <h3><i data-lucide="clock"></i> スケジュール</h3>
                                <button id="add-activity-btn" class="btn btn-secondary btn-sm"><i data-lucide="plus"></i> 予定を追加</button>
                            </div>
                            <div id="activities-list" class="activities-list"></div>
                        </div>
                    </div>

                    <!-- Comments Section -->
                    <section class="card comments-section" style="margin-top: 2.5rem;">
                        <h3><i data-lucide="message-circle"></i> 交流・コメント</h3>
                        <div id="comments-list" class="comments-list">
                            <!-- Comments will be injected here -->
                        </div>
                        <div class="comment-input-area">
                            <input type="text" id="comment-input" placeholder="コメントやアドバイスを入力...">
                            <button id="add-comment-btn" class="btn btn-primary btn-sm">送信</button>
                        </div>
                    </section>
                </div>
                
                <aside class="side-column">
                    <section class="card side-card">
                        <h3><i data-lucide="search"></i> スポットを検索</h3>
                        <div class="map-search-container">
                            <input id="pac-input" class="pac-input" type="text" placeholder="観光地やお店を検索...">
                            <div id="map-preview" style="display:none;"></div>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">
                                <i data-lucide="info"></i> Googleマップで詳細を見る
                            </p>
                        </div>
                    </section>

                    <section class="card side-card">
                        <h3><i data-lucide="info"></i> 旅先メモ & SNS</h3>
                        <textarea id="trip-notes" placeholder="行きたい場所のURLやSNSの情報をメモ..." class="memo-area"></textarea>
                    </section>

                    <section class="card side-card">
                        <div class="section-header">
                            <h3><i data-lucide="star"></i> おすすめ</h3>
                            <button id="add-recom-btn" class="btn-icon"><i data-lucide="plus"></i></button>
                        </div>
                        <div id="recom-list" class="recom-list">
                            <!-- Recommendations here -->
                        </div>
                    </section>
                </aside>
            </div>
        </section>
    </main>

    <!-- Modal for Adding/Editing Activity -->
    <div id="activity-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3 id="modal-title">予定の追加</h3>
                <button id="close-modal" class="btn-icon"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>タイトル</label>
                    <input type="text" id="modal-activity-title" placeholder="例：新千歳空港 到着">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>時間</label>
                        <input type="time" id="modal-activity-time" value="10:00">
                    </div>
                    <div class="input-group">
                        <label>費用 (¥)</label>
                        <input type="number" id="modal-activity-cost" placeholder="0">
                    </div>
                </div>
                <div class="input-group">
                    <label>参考URL (SNSなど)</label>
                    <input type="url" id="modal-activity-url" placeholder="https://instagram.com/...">
                </div>
                <div class="input-group">
                    <label>メモ</label>
                    <textarea id="modal-activity-desc" placeholder="詳細な内容や注意点..."></textarea>
                </div>
                <button id="save-activity-btn" class="btn btn-primary btn-block">保存する</button>
            </div>
        </div>
    </div>

    <!-- Share Trip Modal -->
    <div id="share-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>旅行プランを共有</h3>
                <button id="close-share-modal" class="btn-icon"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>以下の共有コードを友達に送ってください：</p>
                <textarea id="share-code" readonly class="memo-area" style="min-height: 100px; font-size: 0.8rem;"></textarea>
                <button id="copy-share-code" class="btn btn-secondary btn-block">コードをコピー</button>
            </div>
        </div>
    </div>

    <!-- Modal for New Trip -->
    <div id="trip-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card" style="border-top-color: var(--vibrant-2);">
            <div class="modal-header">
                <h3>新しい旅行の作成</h3>
                <button id="close-trip-modal" class="btn-icon"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>旅行のタイトル</label>
                    <input type="text" id="modal-trip-title" placeholder="例：夏の北海道 5日間の旅">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>開始日</label>
                        <input type="date" id="modal-trip-start" value="2026-06-01">
                    </div>
                    <div class="input-group">
                        <label>終了日</label>
                        <input type="date" id="modal-trip-end" value="2026-06-05">
                    </div>
                </div>
                <div class="input-group">
                    <label>全体の予算 (¥)</label>
                    <input type="number" id="modal-trip-budget" value="100000">
                </div>
                <button id="create-trip-btn" class="btn btn-primary btn-block">作成する</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
